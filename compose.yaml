name: sen-bpmn

services:
  app:
    image: ${SEN_BPMN_IMAGE:-sen-bpmn:local}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      SEN_BPMN_STORAGE: sqlite
      SEN_BPMN_DATA_DIR: /app/data
      SEN_BPMN_BPMN_DIR: /app/content/bpmn
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - sen_bpmn_data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/sante').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: [proxy]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy

volumes:
  sen_bpmn_data:
  caddy_data:
  caddy_config:
