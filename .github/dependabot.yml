version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dakar
    open-pull-requests-limit: 5
    ignore:
      # Les versions majeures demandent une migration dédiée et une validation
      # explicite de la compatibilité Next.js, TypeScript et BPMN.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      application:
        patterns: ["next", "react", "react-dom", "bpmn-js"]
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
